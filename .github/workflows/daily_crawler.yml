name: KOPIS Daily ETL Pipeline

on:
  schedule:
    # 💡 UTC 시간 기준입니다. 한국 시간(KST) 새벽 2시는 UTC로 전날 오후 5시(17:00)입니다.
    - cron: '0 17 * * *'
  
  # 깃허브 웹사이트에서 수동으로 실행 버튼을 누를 수 있게 해주는 옵션
  workflow_dispatch: 

jobs:
  run-etl:
    runs-on: ubuntu-latest # 최신 리눅스 가상 서버 할당

    steps:
      - name: 1. 저장소 소스코드 가져오기
        uses: actions/checkout@v4

      - name: 2. 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 대표님 환경에 맞는 버전 (3.10~3.12 무관)
          cache: 'pip'

      - name: 3. 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r backend__v3/requirements.txt
          pip install schedule

      - name: 4. KOPIS 크롤링 및 Supabase 적재 (ETL 실행)
        env:
          # 2단계에서 깃허브 Secrets에 등록한 값을 불러와 환경변수로 주입
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
        run: |
          python DB/run_batch_once.py