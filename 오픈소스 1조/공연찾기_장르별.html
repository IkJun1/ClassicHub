<style>
body{background:#131313;color:#e5e2e1;font-family:'Inter',sans-serif;margin:0;}

/* 장르 탭 */
#genre-tabs{scrollbar-width:none;}
#genre-tabs::-webkit-scrollbar{display:none;}
.genre-tab{position:relative;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.38);background:none;border:none;cursor:pointer;padding:.6rem 0;transition:color .2s;white-space:nowrap;flex-shrink:0;}
.genre-tab::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:#e9c349;transform:scaleX(0);transition:transform .25s ease;}
.genre-tab:hover{color:rgba(255,255,255,.7);}
.genre-tab.on{color:#e9c349;}
.genre-tab.on::after{transform:scaleX(1);}

/* 카드 그리드 — 1px 구분선 그리드 */
.card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}

/* 카드 */
.c-card{position:relative;overflow:hidden;cursor:pointer;background:#1c1b1b;border-radius:12px;transition:background .3s,transform .25s;}
.c-card:hover{background:#202020;transform:translateY(-4px);}
.c-poster{position:relative;aspect-ratio:3/4;background:linear-gradient(145deg,#1c1c1c,#242424);display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px 12px 0 0;}
.c-poster-label{font-size:11px;color:rgba(255,255,255,.13);letter-spacing:.12em;user-select:none;}
.c-poster-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8) 0%,transparent 55%);opacity:0;transition:opacity .3s;}
.c-card:hover .c-poster-grad{opacity:1;}
.c-info{padding:.9rem 1rem 1.1rem;}
.c-label{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#e9c349;opacity:.75;margin-bottom:4px;}
.c-title{font-family:'Noto Serif KR',serif;font-size:13.5px;color:rgba(255,255,255,.88);line-height:1.45;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.c-date{font-size:10.5px;color:rgba(255,255,255,.35);letter-spacing:.04em;}
.c-card:hover .c-date{color:#e9c349;opacity:.7;}

.empty{grid-column:1/-1;padding:5rem 0;text-align:center;font-size:12px;color:rgba(255,255,255,.18);letter-spacing:.1em;}
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const genres = [
        {key:'교향곡',      label:'교향곡'},
        {key:'협주곡',      label:'협주곡'},
        {key:'오페라',      label:'오페라'},
        {key:'가곡',        label:'가곡'},
        {key:'피아노 소나타',label:'피아노 소나타'},
        {key:'변주곡',      label:'변주곡'},
        {key:'기타',        label:'기타'},
    ];

    const performances = [
        {id:1, title:'베토벤 교향곡 9번 합창',        date:'2026.04.12', venue:'예술의전당',           genre:'교향곡',       img:'concert1'},
        {id:2, title:'말러 교향곡 5번',               date:'2026.05.01', venue:'롯데콘서트홀',         genre:'교향곡',       img:'concert2'},
        {id:3, title:'브루크너 교향곡 8번',           date:'2026.06.10', venue:'세종문화회관',         genre:'교향곡',       img:'concert3'},
        {id:4, title:'멘델스존 바이올린 협주곡',      date:'2026.04.20', venue:'롯데콘서트홀',         genre:'협주곡',       img:'concert4'},
        {id:5, title:'라흐마니노프 피아노 협주곡 2번',date:'2026.05.15', venue:'예술의전당',           genre:'협주곡',       img:'concert5'},
        {id:6, title:'브람스 바이올린 협주곡',        date:'2026.06.20', venue:'KBS홀',               genre:'협주곡',       img:'concert6'},
        {id:7, title:'모차르트 마술피리',             date:'2026.05.02', venue:'예술의전당 오페라극장', genre:'오페라',       img:'concert7'},
        {id:8, title:'푸치니 라보엠',                 date:'2026.07.05', venue:'세종문화회관',         genre:'오페라',       img:'concert8'},
        {id:9, title:'슈베르트 겨울 나그네',          date:'2026.05.10', venue:'금호아트홀',           genre:'가곡',         img:'concert1'},
        {id:10,title:'슈만 시인의 사랑',              date:'2026.06.08', venue:'IBK챔버홀',            genre:'가곡',         img:'concert2'},
        {id:11,title:'베토벤 소나타 비창·월광',       date:'2026.05.18', venue:'예술의전당 리사이틀홀', genre:'피아노 소나타',img:'concert3'},
        {id:12,title:'쇼팽 녹턴 & 소나타',           date:'2026.06.25', venue:'롯데콘서트홀',         genre:'피아노 소나타',img:'concert4'},
        {id:13,title:'베토벤 변주곡 세트',            date:'2026.06.01', venue:'통영국제음악당',       genre:'변주곡',       img:'concert5'},
        {id:14,title:'골드베르크 변주곡',             date:'2026.07.12', venue:'IBK챔버홀',            genre:'변주곡',       img:'concert6'},
        {id:15,title:'하이든 현악 합주',              date:'2026.04.28', venue:'세종문화회관',         genre:'기타',         img:'concert7'},
    ];

    const tabsEl = document.getElementById('genre-tabs');
    const gridEl = document.getElementById('concert-grid');
    let activeKey = genres[0].key;

    const renderTabs = () => {
        tabsEl.innerHTML = '';
        genres.forEach(g => {
            const btn = document.createElement('button');
            btn.className = 'genre-tab' + (g.key === activeKey ? ' on' : '');
            btn.textContent = g.label;
            btn.addEventListener('click', () => { activeKey = g.key; renderTabs(); renderGrid(); });
            tabsEl.appendChild(btn);
        });
    };

    const renderGrid = () => {
        const items = performances.filter(p => p.genre === activeKey);
        if (!items.length) { gridEl.innerHTML = '<div class="empty">해당 장르의 공연이 없습니다.</div>'; return; }
        gridEl.innerHTML = items.map(p => `
            <article class="c-card">
                <div class="c-poster">
                    <span class="c-poster-label">${p.img}</span>
                    <div class="c-poster-grad"></div>
                </div>
                <div class="c-info">
                    <p class="c-label">${p.genre}</p>
                    <p class="c-title">${p.title}</p>
                    <p class="c-date">${p.date} · ${p.venue}</p>
                </div>
            </article>
        `).join('');
    };

    renderTabs();
    renderGrid();

    // URL 파라미터로 초기 장르 선택
    const param = new URLSearchParams(location.search).get('genre');
    if (param && genres.find(g => g.key === param)) {
        activeKey = param;
        renderTabs();
        renderGrid();
    }
});
</script>
