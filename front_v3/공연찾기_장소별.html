<style>
body{background:#131313;color:#e5e2e1;font-family:'Inter',sans-serif;margin:0;}

/* ── 지역 탭 ── */
.region-tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;}
.region-tabs::-webkit-scrollbar{display:none;}
.region-tab{
  position:relative;
  font-family:'Noto Serif KR',serif;
  font-size:13px;
  letter-spacing:.04em;
  color:rgba(255,255,255,.38);
  background:none;
  border:none;
  cursor:pointer;
  padding:.65rem 1.2rem;
  transition:color .2s;
  white-space:nowrap;
  flex-shrink:0;
}
.region-tab::after{
  content:'';
  position:absolute;
  bottom:-1px;left:0;right:0;
  height:2px;
  background:#e9c349;
  transform:scaleX(0);
  transition:transform .25s ease;
}
.region-tab:hover{color:rgba(255,255,255,.65);}
.region-tab.on{color:#fff;}
.region-tab.on::after{transform:scaleX(1);}

	/* ── 공연장 선택 섹션 ── */
	.venue-section{
	  padding:1.6rem 3rem;
	  border-bottom:1px solid rgba(255,255,255,.06);
	  background:linear-gradient(180deg,#161616 0%,#131313 100%);
}
.venue-section-label{
  font-size:9px;
  letter-spacing:.3em;
  text-transform:uppercase;
	  color:rgba(233,195,73,.5);
	  margin-bottom:.85rem;
	}
	.venue-picker{position:relative;max-width:560px;}
	.venue-select-button{
	  width:100%;
	  display:flex;
	  align-items:center;
	  justify-content:space-between;
	  gap:1rem;
	  padding:.9rem 1rem;
	  border:1px solid rgba(255,255,255,.12);
	  border-radius:8px;
	  background:rgba(255,255,255,.035);
	  color:rgba(255,255,255,.82);
	  cursor:pointer;
	  transition:border-color .18s,background .18s;
	  text-align:left;
	}
	.venue-select-button:hover,
	.venue-picker.open .venue-select-button{
	  border-color:rgba(233,195,73,.55);
	  background:rgba(233,195,73,.06);
	}
	.venue-selected-name{
	  font-family:'Noto Serif KR',serif;
	  font-size:15px;
	  overflow:hidden;
	  text-overflow:ellipsis;
	  white-space:nowrap;
	}
	.venue-selected-meta{
	  flex-shrink:0;
	  font-size:10px;
	  letter-spacing:.12em;
	  color:rgba(233,195,73,.55);
	  text-transform:uppercase;
	}
	.venue-dropdown{
	  position:absolute;
	  top:calc(100% + 8px);
	  left:0;
	  right:0;
	  z-index:30;
	  display:none;
	  border:1px solid rgba(233,195,73,.22);
	  border-radius:10px;
	  background:#181817;
	  box-shadow:0 18px 50px rgba(0,0,0,.48);
	  overflow:hidden;
	}
	.venue-picker.open .venue-dropdown{display:block;}
	.venue-search-wrap{padding:.8rem;border-bottom:1px solid rgba(255,255,255,.06);}
	.venue-search{
	  width:100%;
	  border:1px solid rgba(255,255,255,.1);
	  border-radius:7px;
	  background:#101010;
	  color:#e5e2e1;
	  padding:.72rem .85rem;
	  font-size:13px;
	  outline:none;
	}
	.venue-search:focus{border-color:rgba(233,195,73,.55);}
	.venue-options{max-height:320px;overflow-y:auto;padding:.35rem;}
	.venue-option{
	  width:100%;
	  display:flex;
	  align-items:center;
	  justify-content:space-between;
	  gap:1rem;
	  padding:.7rem .75rem;
	  border:0;
	  border-radius:6px;
	  background:transparent;
	  color:rgba(255,255,255,.62);
	  cursor:pointer;
	  text-align:left;
	  font-size:12px;
	}
	.venue-option:hover,
	.venue-option.active{background:rgba(233,195,73,.08);color:#e9c349;}
	.venue-option-count{font-size:10px;color:rgba(255,255,255,.26);white-space:nowrap;}
	.venue-option-empty{padding:1.4rem .9rem;color:rgba(255,255,255,.35);font-size:12px;text-align:center;}
	.venue-dropdown-hint{padding:.55rem .85rem;border-top:1px solid rgba(255,255,255,.05);font-size:10px;color:rgba(255,255,255,.28);}
	.venue-chips{display:flex;flex-wrap:wrap;gap:.6rem;}

.chip{
  display:inline-flex;
  align-items:center;
  gap:.4rem;
  position:relative;
  cursor:pointer;
  padding:.42rem 1rem .42rem 1.1rem;
  border:1px solid rgba(255,255,255,.1);
  border-radius:2px;
  font-size:11.5px;
  color:rgba(255,255,255,.5);
  letter-spacing:.02em;
  background:rgba(255,255,255,.03);
  transition:all .18s;
  user-select:none;
}
.chip:hover{
  border-color:rgba(233,195,73,.5);
  color:rgba(255,255,255,.85);
  background:rgba(233,195,73,.06);
}
.chip.active{
  border-color:#e9c349;
  color:#e9c349;
  background:rgba(233,195,73,.1);
  font-weight:500;
}
.chip-count{
  font-size:9.5px;
  color:rgba(255,255,255,.22);
  font-weight:400;
  letter-spacing:0;
  transition:color .18s;
}
.chip.active .chip-count{color:rgba(233,195,73,.55);}
.chip:hover .chip-count{color:rgba(233,195,73,.4);}

.chip-dot{
  width:5px;height:5px;
  border-radius:50%;
  background:#e9c349;
  opacity:0;
  transition:opacity .18s;
  flex-shrink:0;
}
.chip.active .chip-dot{opacity:1;}

/* ── 카드 그리드 ── */
.card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}

.c-card{position:relative;overflow:hidden;cursor:pointer;background:#1c1b1b;border-radius:12px;transition:background .3s,transform .25s;}
.c-card:hover{background:#202020;transform:translateY(-4px);}
.c-poster{position:relative;aspect-ratio:3/4;background:linear-gradient(145deg,#1c1c1c,#242424);display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px 12px 0 0;}
.c-poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;transition:transform .4s;}
.c-card:hover .c-poster img{transform:scale(1.04);}
.c-poster-ph{font-size:11px;color:rgba(255,255,255,.1);letter-spacing:.1em;}
.c-poster-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 55%);opacity:0;transition:opacity .3s;}
.c-card:hover .c-poster-grad{opacity:1;}
.c-info{padding:.9rem 1rem 1.1rem;}
.c-venue-label{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#e9c349;opacity:.75;margin-bottom:4px;}
.c-title{font-family:'Noto Serif KR',serif;font-size:13px;color:rgba(255,255,255,.88);line-height:1.45;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.c-date{font-size:10.5px;color:rgba(255,255,255,.35);letter-spacing:.04em;}
.c-status{display:inline-block;font-size:8.5px;letter-spacing:.12em;padding:.15rem .45rem;border-radius:2px;margin-left:.4rem;}
.c-status.upcoming{background:rgba(233,195,73,.12);color:rgba(233,195,73,.7);}
.c-status.ongoing{background:rgba(100,200,120,.12);color:rgba(100,200,120,.7);}
.c-status.done{background:rgba(255,255,255,.07);color:rgba(255,255,255,.28);}
.c-card:hover .c-date{color:rgba(233,195,73,.6);}

/* 결과 헤더 */
.result-header{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:1.4rem;
}
.result-title{font-family:'Noto Serif KR',serif;font-size:15px;color:rgba(255,255,255,.7);}
.result-count{font-size:11px;color:rgba(255,255,255,.25);letter-spacing:.08em;}

.empty{padding:5rem 0;text-align:center;font-size:12px;color:rgba(255,255,255,.18);letter-spacing:.1em;}

/* 애니메이션 */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.fade-up{animation:fadeUp .28s ease both;}
/* ── 상세 모달 ───────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-box{position:relative;width:min(820px,66vw);background:#111;border-radius:6px;overflow:hidden;display:grid;grid-template-columns:320px 1fr;transform:translateY(12px);transition:transform .25s ease;}
.modal-overlay.open .modal-box{transform:translateY(0);}
.modal-poster{position:relative;background:#0e0e0e;display:flex;align-items:center;justify-content:center;overflow:hidden;aspect-ratio:3/4;}
.modal-poster-bg{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(255,255,255,.012) 40px,rgba(255,255,255,.012) 41px),linear-gradient(160deg,#141414,#0a0a0a);}
.modal-poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.modal-poster-ph{position:relative;z-index:1;font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.4em;color:rgba(255,255,255,.06);text-transform:uppercase;}
.modal-poster-fade{position:absolute;inset:0;z-index:2;background:linear-gradient(to right,transparent 60%,#111 100%);}
.modal-poster-top{position:absolute;top:0;left:0;right:0;height:80px;z-index:2;background:linear-gradient(to bottom,rgba(0,0,0,.35),transparent);}
.modal-body{padding:30px 28px 24px 26px;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto;}
.modal-xbtn{position:absolute;top:14px;right:16px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer;font-weight:300;z-index:10;line-height:1;transition:all .2s;}
.modal-xbtn:hover{background:rgba(255,255,255,0.14);color:#fff;}
.modal-eyebrow{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;letter-spacing:.18em;color:rgba(233,195,73,.5);margin-bottom:10px;}
.modal-title-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px;}
.modal-title{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:700;color:#fff;line-height:1.45;flex:1;}

.modal-rule{width:100%;height:1px;background:linear-gradient(to right,rgba(233,195,73,.35),transparent);margin-bottom:20px;}
.modal-meta{display:flex;flex-direction:column;gap:14px;margin-bottom:28px;}
.modal-mrow{display:flex;align-items:baseline;}
.modal-mk{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.22);width:56px;flex-shrink:0;}
.modal-mv{font-size:14px;color:rgba(255,255,255,.62);line-height:1.55;}
.modal-mv.cast{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;color:rgba(255,255,255,.45);}
.modal-s{display:inline-block;font-size:10px;letter-spacing:.12em;padding:4px 11px;border-radius:2px;}
.modal-s.upcoming{background:rgba(233,195,73,.08);color:rgba(233,195,73,.75);border:1px solid rgba(233,195,73,.15);}
.modal-s.ongoing{background:rgba(100,200,130,.08);color:rgba(100,200,130,.75);border:1px solid rgba(100,200,130,.15);}
.modal-s.done{background:rgba(255,255,255,.04);color:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.08);}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;padding-top:16px;border-top:1px solid rgba(255,255,255,.05);}
.modal-close{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.18);background:none;border:none;cursor:pointer;padding:0;transition:color .2s;}
.modal-close:hover{color:rgba(255,255,255,.45);}
.modal-kbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;background:transparent;border:1px solid rgba(233,195,73,.45);color:#e9c349;font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;border-radius:2px;cursor:pointer;text-decoration:none;transition:background .2s,border-color .2s;}
.modal-kbtn:hover{background:rgba(233,195,73,.08);border-color:#e9c349;}
.modal-kbtn svg{width:10px;height:10px;opacity:.8;}
</style>

/* =====================================================================
   ClassicHub — 장소별 조회 (백엔드 연동)
   API: GET /api/venues/by-region, GET /api/performances?venue=...
===================================================================== */
document.addEventListener('DOMContentLoaded', async () => {
    const API = window.ClassicHubAPI;
    const PAGE_SIZE = 20;

    let venuesByRegion = {};
    let regions = [];
	    let activeRegion = null;
	    let activeVenue = null;
	    let activeStatus = '공연예정';
	    let venueSearchTerm = '';
	    let currentPage = 1;
	
	    const regionTabsEl = document.getElementById('region-tabs');
	    const venuePickerEl = document.getElementById('venue-picker');
	    const venueSelectBtn = document.getElementById('venue-select-button');
	    const venueSelectedNameEl = document.getElementById('venue-selected-name');
	    const venueSelectedMetaEl = document.getElementById('venue-selected-meta');
	    const venueSearchEl = document.getElementById('venue-search');
	    const venueOptionsEl = document.getElementById('venue-options');
	    const gridEl = document.getElementById('concert-grid');
    const paginEl = document.getElementById('pagination');
    const resultCountEl = document.getElementById('result-count');
    const statusFiltersEl = document.getElementById('status-filters');

    const preferredRegionOrder = ['서울', '경기', '인천', '부산', '대구', '대전', '광주', '울산', '강원', '충북', '충남', '전북', '전남', '경북', '경남', '제주', '세종', '기타'];

    function sortRegions(input) {
        return [...input].sort((a, b) => {
            const ia = preferredRegionOrder.indexOf(a);
            const ib = preferredRegionOrder.indexOf(b);
            if (ia !== -1 || ib !== -1) return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
            return a.localeCompare(b, 'ko');
        });
    }

    function getVenueLabel(key) { return key || ''; }

    async function loadVenuesByRegion() {
        try {
            const res = await API.getVenuesByRegion();
            venuesByRegion = res.data || {};
        } catch (e) {
            console.error('지역별 공연장 목록 조회 실패:', e);
            venuesByRegion = {};
        }

        regions = sortRegions(Object.keys(venuesByRegion).filter(r => Array.isArray(venuesByRegion[r]) && venuesByRegion[r].length));

        const params = new URLSearchParams(location.search);
        const paramR = params.get('region');
        const paramV = params.get('venue');

        activeRegion = paramR && regions.includes(paramR) ? paramR : regions[0];
        if (paramV) {
            const owningRegion = regions.find(r => venuesByRegion[r].includes(paramV));
            if (owningRegion) {
                activeRegion = owningRegion;
                activeVenue = paramV;
            }
        }
        if (!activeVenue) activeVenue = venuesByRegion[activeRegion]?.[0] || null;
    }

    function renderRegionTabs() {
        if (!regionTabsEl) return;
        regionTabsEl.innerHTML = '';
        if (!regions.length) {
            regionTabsEl.innerHTML = '<span style="color:rgba(255,255,255,.35);font-size:12px;">지역 목록을 불러오지 못했습니다.</span>';
            return;
        }
        regions.forEach(region => {
            const btn = document.createElement('button');
            btn.className = 'region-tab' + (region === activeRegion ? ' on' : '');
            btn.textContent = region;
	            btn.addEventListener('click', () => {
	                activeRegion = region;
	                activeVenue = venuesByRegion[activeRegion]?.[0] || null;
	                venueSearchTerm = '';
	                currentPage = 1;
	                renderRegionTabs();
	                renderVenuePicker();
	                renderGrid();
	            });
            regionTabsEl.appendChild(btn);
        });
    }

	    function setVenueDropdownOpen(open) {
	        if (!venuePickerEl || !venueSelectBtn) return;
	        venuePickerEl.classList.toggle('open', open);
	        venueSelectBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
	        if (open) {
	            setTimeout(() => venueSearchEl?.focus(), 30);
	        }
	    }

	    function getFilteredVenues() {
	        const venues = venuesByRegion[activeRegion] || [];
	        const q = venueSearchTerm.trim().toLowerCase();
	        if (!q) return venues;
	        return venues.filter(v => String(v).toLowerCase().includes(q));
	    }

	    function renderVenuePicker() {
	        const venues = venuesByRegion[activeRegion] || [];
	        if (!venueSelectedNameEl || !venueSelectedMetaEl || !venueOptionsEl) return;
	        if (!venues.length) {
	            activeVenue = null;
	            venueSelectedNameEl.textContent = '선택한 지역의 공연장이 없습니다';
	            venueSelectedMetaEl.textContent = '';
	            venueOptionsEl.innerHTML = '<div class="venue-option-empty">공연장 목록이 없습니다.</div>';
	            return;
	        }
	        if (!activeVenue || !venues.includes(activeVenue)) activeVenue = venues[0];
	        venueSelectedNameEl.textContent = activeVenue;
	        venueSelectedMetaEl.textContent = `${activeRegion || ''} · ${venues.length}개`;
	        if (venueSearchEl && venueSearchEl.value !== venueSearchTerm) venueSearchEl.value = venueSearchTerm;
	        renderVenueOptions();
	    }

	    function renderVenueOptions() {
	        if (!venueOptionsEl) return;
	        const filtered = getFilteredVenues();
	        if (!filtered.length) {
	            venueOptionsEl.innerHTML = '<div class="venue-option-empty">검색 결과가 없습니다.</div>';
	            return;
	        }
	        venueOptionsEl.innerHTML = filtered.map(v => `
	            <button type="button" class="venue-option ${v === activeVenue ? 'active' : ''}" data-venue="${API.escapeHTML(v)}" role="option" aria-selected="${v === activeVenue ? 'true' : 'false'}">
	                <span>${API.escapeHTML(v)}</span>
	                ${v === activeVenue ? '<span class="venue-option-count">선택됨</span>' : ''}
	            </button>
	        `).join('');
	        venueOptionsEl.querySelectorAll('[data-venue]').forEach(btn => {
	            btn.addEventListener('click', () => {
	                activeVenue = btn.dataset.venue;
	                venueSearchTerm = '';
	                if (venueSearchEl) venueSearchEl.value = '';
	                currentPage = 1;
	                setVenueDropdownOpen(false);
	                renderVenuePicker();
	                renderGrid();
	            });
	        });
	    }

	    if (venueSelectBtn) {
	        venueSelectBtn.addEventListener('click', () => {
	            setVenueDropdownOpen(!venuePickerEl.classList.contains('open'));
	        });
	    }
	    if (venueSearchEl) {
	        venueSearchEl.addEventListener('input', () => {
	            venueSearchTerm = venueSearchEl.value;
	            renderVenueOptions();
	        });
	        venueSearchEl.addEventListener('keydown', (e) => {
	            if (e.key === 'Escape') setVenueDropdownOpen(false);
	        });
	    }
	    document.addEventListener('click', (e) => {
	        if (venuePickerEl && !venuePickerEl.contains(e.target)) setVenueDropdownOpen(false);
	    });

    function getStatusClass(s) {
        if (s === '공연예정') return 'upcoming';
        if (s === '공연중') return 'ongoing';
        return 'done';
    }
    function getStatusLabel(s) {
        if (s === '공연예정') return '예정';
        if (s === '공연중') return '진행중';
        if (s === '공연완료') return '완료';
        if (s === 'all') return '전체';
        return s || '';
    }
    function renderStatusFilters() {
        if (!statusFiltersEl) return;
        const options = [
            { key: '공연예정', label: '예정' },
            { key: '공연중', label: '진행중' },
            { key: '공연완료', label: '완료' },
            { key: 'all', label: '전체' },
        ];
        statusFiltersEl.innerHTML = options.map(opt => `
            <button type="button" data-status="${opt.key}" style="padding:.45rem .75rem;border-radius:999px;border:1px solid ${activeStatus===opt.key?'#e9c349':'rgba(255,255,255,.12)'};background:${activeStatus===opt.key?'#e9c349':'rgba(255,255,255,.03)'};color:${activeStatus===opt.key?'#131313':'rgba(255,255,255,.65)'};font-size:11px;cursor:pointer;">
                ${opt.label}
            </button>
        `).join('');
        statusFiltersEl.querySelectorAll('[data-status]').forEach(btn => {
            btn.addEventListener('click', () => {
                activeStatus = btn.dataset.status;
                currentPage = 1;
                renderStatusFilters();
                renderGrid();
            });
        });
    }


    window.openModal = function openModal(p) {
        const overlay  = document.getElementById('concert-modal');
        const img = document.getElementById('modal-poster-img');
        const ph  = document.getElementById('modal-poster-ph');
        if (p.poster) {
            img.src = p.poster; img.alt = p.title;
            img.style.display = 'block'; ph.style.display = 'none';
        } else {
            img.style.display = 'none'; ph.style.display = '';
        }
        document.getElementById('modal-genre').textContent  = p.genre || '';
        document.getElementById('modal-title').textContent  = p.title || '';
        document.getElementById('modal-date').textContent   =
            p.startDate === p.endDate ? p.startDate : `${p.startDate} ~ ${p.endDate}`;
        document.getElementById('modal-venue').textContent  = p.venue || '';
        const sEl = document.getElementById('modal-status');
        sEl.textContent = p.status || '';
        sEl.className   = 'modal-s ' + getStatusClass(p.status);
        const rtRow = document.getElementById('modal-runtime-row');
        const rtEl  = document.getElementById('modal-runtime');
        if (p.runtime) { rtEl.textContent = p.runtime; rtRow.style.display = 'flex'; }
        else { rtRow.style.display = 'none'; }
        const castRow = document.getElementById('modal-cast-row');
        const castEl  = document.getElementById('modal-cast');
        if (p.cast) { castEl.textContent = p.cast; castRow.style.display = 'flex'; }
        else { castRow.style.display = 'none'; }
        const kbtn = document.getElementById('modal-kopis-btn');
        const ticketUrl = p.reservationUrl || p.kopisUrl || '';
        if (ticketUrl) {
            kbtn.href = ticketUrl;
            kbtn.style.pointerEvents = '';
            kbtn.style.opacity = '';
            kbtn.textContent = '예매하기';
        } else {
            kbtn.removeAttribute('href');
            kbtn.style.pointerEvents = 'none';
            kbtn.style.opacity = '.45';
            kbtn.textContent = '예매 정보 없음';
        }
        window.ClassicHubBookmarks?.bindModal?.(p);
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
    };

    window.closeModal = function() {
        document.getElementById('concert-modal').classList.remove('open');
        document.body.style.overflow = '';
    };
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    function renderPagination(total, page) {
        if (!paginEl) return;
        const pages = Math.ceil(total / PAGE_SIZE);
        if (pages <= 1) { paginEl.innerHTML = ''; return; }
        const btn = (i, active) =>
            `<button onclick="goPage(${i})" style="padding:.4rem .75rem;background:${active?'#e9c349':'none'};border:1px solid ${active?'#e9c349':'rgba(255,255,255,.12)'};color:${active?'#131313':'rgba(255,255,255,.45)'};border-radius:4px;cursor:pointer;font-size:12px;min-width:32px;">${i}</button>`;
        let html = `<button onclick="goPage(${page-1})" ${page<=1?'disabled':''} style="padding:.4rem .7rem;background:none;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.45);border-radius:4px;cursor:pointer;font-size:12px;">‹</button>`;
        for (let i = 1; i <= pages; i++) {
            if (i===1||i===pages||(i>=page-2&&i<=page+2)) html += btn(i, i===page);
            else if (i===page-3||i===page+3) html += `<span style="color:rgba(255,255,255,.25);padding:.4rem .2rem;">…</span>`;
        }
        html += `<button onclick="goPage(${page+1})" ${page>=pages?'disabled':''} style="padding:.4rem .7rem;background:none;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.45);border-radius:4px;cursor:pointer;font-size:12px;">›</button>`;
        paginEl.innerHTML = html;
    }

    window.goPage = function(p) {
        currentPage = Math.max(1, p);
        renderGrid();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    async function openModalFromSummary(summary) {
        openModal({ ...summary, title: '불러오는 중...' });
        try {
            openModal(await API.getPerformanceDetail(summary.id));
        } catch (e) {
            console.error('공연 상세 조회 실패:', e);
            openModal(summary);
        }
    }

    async function renderGrid() {
        if (!activeVenue) {
            resultCountEl.textContent = '0개 공연';
            gridEl.innerHTML = '<div class="empty">공연장을 선택할 수 없습니다.</div>';
            if (paginEl) paginEl.innerHTML = '';
            return;
        }

        resultCountEl.textContent = '조회 중...';
        gridEl.innerHTML = '<div class="empty">공연 정보를 불러오는 중입니다.</div>';
        try {
            const res = await API.getPerformances({
                venue: activeVenue,
                page: currentPage,
                per_page: PAGE_SIZE,
                status: activeStatus,
                sort: 'date_asc',
            });
            const items = (res.data || []).map(p => API.normalizePerformanceSummary(p, '공연예정'));
            resultCountEl.textContent = `${activeRegion || ''} · ${activeVenue} · ${getStatusLabel(activeStatus) || '전체'} · ${res.total || 0}개 공연`;

            if (!items.length) {
                gridEl.innerHTML = '<div class="empty">해당 조건의 공연 정보가 없습니다.</div>';
                if (paginEl) paginEl.innerHTML = '';
                return;
            }

            gridEl.innerHTML = items.map((p, i) => {
                const sc = getStatusClass(p.status);
                const sl = getStatusLabel(p.status);
                return `
                <article class="c-card fade-up" style="animation-delay:${Math.min(i,11)*0.03}s" data-idx="${i}">
                    <div class="c-poster">
                        ${p.poster ? `<img src="${p.poster}" alt="${p.title}" loading="lazy" onerror="this.style.display='none'">` : ''}
                        <span class="c-poster-ph">CLASSIC</span>
                        <div class="c-poster-grad"></div>
                    </div>
                    <div class="c-info">
                        <p class="c-venue-label">${getVenueLabel(p.venue || activeVenue)}</p>
                        <p class="c-title">${p.title}</p>
                        <p class="c-date">${p.startDate}<span class="c-status ${sc}">${sl}</span></p>
                    </div>
                </article>`;
            }).join('');

            renderPagination(res.total || 0, currentPage);
            gridEl.querySelectorAll('.c-card').forEach(card => {
                card.addEventListener('click', () => openModalFromSummary(items[+card.dataset.idx]));
            });
        } catch (e) {
            console.error('장소별 공연 조회 실패:', e);
            resultCountEl.textContent = '조회 실패';
            gridEl.innerHTML = '<div class="empty">백엔드 데이터를 불러오지 못했습니다. 서버가 실행 중인지 확인하세요.</div>';
            if (paginEl) paginEl.innerHTML = '';
        }
    }

	    await loadVenuesByRegion();
	    renderRegionTabs();
	    renderVenuePicker();
	    renderStatusFilters();
	    renderGrid();
});
</script>

<!-- ── 상세 모달 ── -->
<div class="modal-overlay" id="concert-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-poster" id="modal-poster">
      <div class="modal-poster-bg"></div>
      <img id="modal-poster-img" src="" alt="" style="display:none;">
      <span class="modal-poster-ph" id="modal-poster-ph">CLASSIC</span>
      <div class="modal-poster-fade"></div>
      <div class="modal-poster-top"></div>
    </div>
    <div class="modal-body">
      <button class="modal-xbtn" onclick="closeModal()">×</button>
      <div>
        <p class="modal-eyebrow" id="modal-genre"></p>
        <div class="modal-title-row">
          <span class="modal-title" id="modal-title"></span>
        </div>
        <div class="modal-rule"></div>
        <div class="modal-meta">
          <div class="modal-mrow">
            <span class="modal-mk">상태</span>
            <span class="modal-mv"><span class="modal-s" id="modal-status"></span></span>
          </div>
          <div class="modal-mrow">
            <span class="modal-mk">기간</span>
            <span class="modal-mv" id="modal-date"></span>
          </div>
          <div class="modal-mrow">
            <span class="modal-mk">장소</span>
            <span class="modal-mv" id="modal-venue"></span>
          </div>
          <div class="modal-mrow" id="modal-runtime-row">
            <span class="modal-mk">런타임</span>
            <span class="modal-mv" id="modal-runtime"></span>
          </div>
          <div class="modal-mrow" id="modal-cast-row">
            <span class="modal-mk">출연진</span>
            <span class="modal-mv cast" id="modal-cast"></span>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <a class="modal-kbtn" id="modal-kopis-btn" href="#" target="_blank" rel="noopener">
          예매하기
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>
        </a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
