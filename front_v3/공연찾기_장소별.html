<style>
body{background:#131313;color:#e5e2e1;font-family:'Inter',sans-serif;margin:0;}

/* ── 지역 탭 ── */
.region-tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;}
.region-tabs::-webkit-scrollbar{display:none;}
.region-tab{
  position:relative;
  font-family:'Noto Serif KR',serif;
  font-size:13px;
  letter-spacing:.04em;
  color:rgba(255,255,255,.38);
  background:none;
  border:none;
  cursor:pointer;
  padding:.65rem 1.2rem;
  transition:color .2s;
  white-space:nowrap;
  flex-shrink:0;
}
.region-tab::after{
  content:'';
  position:absolute;
  bottom:-1px;left:0;right:0;
  height:2px;
  background:#e9c349;
  transform:scaleX(0);
  transition:transform .25s ease;
}
.region-tab:hover{color:rgba(255,255,255,.65);}
.region-tab.on{color:#fff;}
.region-tab.on::after{transform:scaleX(1);}

/* ── 공연장 칩 섹션 ── */
.venue-section{
  padding:1.6rem 3rem;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:linear-gradient(180deg,#161616 0%,#131313 100%);
}
.venue-section-label{
  font-size:9px;
  letter-spacing:.3em;
  text-transform:uppercase;
  color:rgba(233,195,73,.5);
  margin-bottom:.85rem;
}
.venue-chips{display:flex;flex-wrap:wrap;gap:.6rem;}

.chip{
  display:inline-flex;
  align-items:center;
  gap:.4rem;
  position:relative;
  cursor:pointer;
  padding:.42rem 1rem .42rem 1.1rem;
  border:1px solid rgba(255,255,255,.1);
  border-radius:2px;
  font-size:11.5px;
  color:rgba(255,255,255,.5);
  letter-spacing:.02em;
  background:rgba(255,255,255,.03);
  transition:all .18s;
  user-select:none;
}
.chip:hover{
  border-color:rgba(233,195,73,.5);
  color:rgba(255,255,255,.85);
  background:rgba(233,195,73,.06);
}
.chip.active{
  border-color:#e9c349;
  color:#e9c349;
  background:rgba(233,195,73,.1);
  font-weight:500;
}
.chip-count{
  font-size:9.5px;
  color:rgba(255,255,255,.22);
  font-weight:400;
  letter-spacing:0;
  transition:color .18s;
}
.chip.active .chip-count{color:rgba(233,195,73,.55);}
.chip:hover .chip-count{color:rgba(233,195,73,.4);}

.chip-dot{
  width:5px;height:5px;
  border-radius:50%;
  background:#e9c349;
  opacity:0;
  transition:opacity .18s;
  flex-shrink:0;
}
.chip.active .chip-dot{opacity:1;}

/* ── 카드 그리드 ── */
.card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}

.c-card{position:relative;overflow:hidden;cursor:pointer;background:#1c1b1b;border-radius:12px;transition:background .3s,transform .25s;}
.c-card:hover{background:#202020;transform:translateY(-4px);}
.c-poster{position:relative;aspect-ratio:3/4;background:linear-gradient(145deg,#1c1c1c,#242424);display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px 12px 0 0;}
.c-poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;transition:transform .4s;}
.c-card:hover .c-poster img{transform:scale(1.04);}
.c-poster-ph{font-size:11px;color:rgba(255,255,255,.1);letter-spacing:.1em;}
.c-poster-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,transparent 55%);opacity:0;transition:opacity .3s;}
.c-card:hover .c-poster-grad{opacity:1;}
.c-info{padding:.9rem 1rem 1.1rem;}
.c-venue-label{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#e9c349;opacity:.75;margin-bottom:4px;}
.c-title{font-family:'Noto Serif KR',serif;font-size:13px;color:rgba(255,255,255,.88);line-height:1.45;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.c-date{font-size:10.5px;color:rgba(255,255,255,.35);letter-spacing:.04em;}
.c-status{display:inline-block;font-size:8.5px;letter-spacing:.12em;padding:.15rem .45rem;border-radius:2px;margin-left:.4rem;}
.c-status.upcoming{background:rgba(233,195,73,.12);color:rgba(233,195,73,.7);}
.c-status.ongoing{background:rgba(100,200,120,.12);color:rgba(100,200,120,.7);}
.c-status.done{background:rgba(255,255,255,.07);color:rgba(255,255,255,.28);}
.c-card:hover .c-date{color:rgba(233,195,73,.6);}

/* 결과 헤더 */
.result-header{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:1.4rem;
}
.result-title{font-family:'Noto Serif KR',serif;font-size:15px;color:rgba(255,255,255,.7);}
.result-count{font-size:11px;color:rgba(255,255,255,.25);letter-spacing:.08em;}

.empty{padding:5rem 0;text-align:center;font-size:12px;color:rgba(255,255,255,.18);letter-spacing:.1em;}

/* 애니메이션 */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.fade-up{animation:fadeUp .28s ease both;}
/* ── 상세 모달 ───────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-box{position:relative;width:min(820px,66vw);background:#111;border-radius:6px;overflow:hidden;display:grid;grid-template-columns:320px 1fr;transform:translateY(12px);transition:transform .25s ease;}
.modal-overlay.open .modal-box{transform:translateY(0);}
.modal-poster{position:relative;background:#0e0e0e;display:flex;align-items:center;justify-content:center;overflow:hidden;aspect-ratio:3/4;}
.modal-poster-bg{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(255,255,255,.012) 40px,rgba(255,255,255,.012) 41px),linear-gradient(160deg,#141414,#0a0a0a);}
.modal-poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.modal-poster-ph{position:relative;z-index:1;font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.4em;color:rgba(255,255,255,.06);text-transform:uppercase;}
.modal-poster-fade{position:absolute;inset:0;z-index:2;background:linear-gradient(to right,transparent 60%,#111 100%);}
.modal-poster-top{position:absolute;top:0;left:0;right:0;height:80px;z-index:2;background:linear-gradient(to bottom,rgba(0,0,0,.35),transparent);}
.modal-body{padding:30px 28px 24px 26px;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto;}
.modal-xbtn{position:absolute;top:14px;right:16px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer;font-weight:300;z-index:10;line-height:1;transition:all .2s;}
.modal-xbtn:hover{background:rgba(255,255,255,0.14);color:#fff;}
.modal-eyebrow{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;letter-spacing:.18em;color:rgba(233,195,73,.5);margin-bottom:10px;}
.modal-title-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px;}
.modal-title{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:700;color:#fff;line-height:1.45;flex:1;}

.modal-rule{width:100%;height:1px;background:linear-gradient(to right,rgba(233,195,73,.35),transparent);margin-bottom:20px;}
.modal-meta{display:flex;flex-direction:column;gap:14px;margin-bottom:28px;}
.modal-mrow{display:flex;align-items:baseline;}
.modal-mk{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.22);width:56px;flex-shrink:0;}
.modal-mv{font-size:14px;color:rgba(255,255,255,.62);line-height:1.55;}
.modal-mv.cast{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;color:rgba(255,255,255,.45);}
.modal-s{display:inline-block;font-size:10px;letter-spacing:.12em;padding:4px 11px;border-radius:2px;}
.modal-s.upcoming{background:rgba(233,195,73,.08);color:rgba(233,195,73,.75);border:1px solid rgba(233,195,73,.15);}
.modal-s.ongoing{background:rgba(100,200,130,.08);color:rgba(100,200,130,.75);border:1px solid rgba(100,200,130,.15);}
.modal-s.done{background:rgba(255,255,255,.04);color:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.08);}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;padding-top:16px;border-top:1px solid rgba(255,255,255,.05);}
.modal-close{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.18);background:none;border:none;cursor:pointer;padding:0;transition:color .2s;}
.modal-close:hover{color:rgba(255,255,255,.45);}
.modal-kbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;background:transparent;border:1px solid rgba(233,195,73,.45);color:#e9c349;font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;border-radius:2px;cursor:pointer;text-decoration:none;transition:background .2s,border-color .2s;}
.modal-kbtn:hover{background:rgba(233,195,73,.08);border-color:#e9c349;}
.modal-kbtn svg{width:10px;height:10px;opacity:.8;}

const REGIONS = Object.keys(DB);

let activeRegion = REGIONS[0];
let activeVenue = null;
let currentPage = 1;
const PAGE_SIZE = 20;

const regionTabsEl = document.getElementById('region-tabs');
const venueChipsEl = document.getElementById('venue-chips');
const gridEl = document.getElementById('concert-grid');
const paginEl = document.getElementById('pagination');
const resultCountEl = document.getElementById('result-count');

function getVenueLabel(key) {
    return VENUE_LABELS[key] || key;
}

function renderRegionTabs() {
    regionTabsEl.innerHTML = '';
    REGIONS.forEach(r => {
        const btn = document.createElement('button');
        btn.className = 'region-tab' + (r === activeRegion ? ' on' : '');
        btn.textContent = r;
        btn.addEventListener('click', () => {
            activeRegion = r;
            activeVenue = null;
            currentPage = 1;
            renderRegionTabs();
            renderVenueChips();
            renderGrid();
        });
        regionTabsEl.appendChild(btn);
    });
}

function renderVenueChips() {
    venueChipsEl.innerHTML = '';
    const regionData = DB[activeRegion] || {};
    const venueKeys = Object.keys(regionData);
    
    if (venueKeys.length === 0) return;
    
    // 자동으로 첫 번째 venue 선택
    if (!activeVenue || !regionData[activeVenue]) {
        activeVenue = venueKeys[0];
    }
    
    venueKeys.forEach((vk, i) => {
        const count = regionData[vk].length;
        const label = getVenueLabel(vk);
        const chip = document.createElement('button');
        chip.className = 'chip' + (vk === activeVenue ? ' active' : '');
        chip.innerHTML = `<span class="chip-dot"></span>${label}<span class="chip-count">${count}</span>`;
        chip.addEventListener('click', () => {
            activeVenue = vk;
            currentPage = 1;
            renderVenueChips();
            renderGrid();
        });
        venueChipsEl.appendChild(chip);
    });
}

function getStatusClass(s) {
    if (s === '공연예정') return 'upcoming';
    if (s === '공연중') return 'ongoing';
    return 'done';
}
function getStatusLabel(s) {
    if (s === '공연예정') return '예정';
    if (s === '공연중') return '진행중';
    return '완료';
}

    window.openModal = function openModal(p) {
        const overlay  = document.getElementById('concert-modal');
        // 포스터
        const img = document.getElementById('modal-poster-img');
        const ph  = document.getElementById('modal-poster-ph');
        if (p.poster) {
            img.src = p.poster; img.alt = p.title;
            img.style.display = 'block'; ph.style.display = 'none';
        } else {
            img.style.display = 'none'; ph.style.display = '';
        }
        // 텍스트 채우기
        document.getElementById('modal-genre').textContent  = p.genre || '';
        document.getElementById('modal-title').textContent  = p.title || '';
        document.getElementById('modal-date').textContent   =
            p.startDate === p.endDate ? p.startDate : p.startDate + ' ~ ' + p.endDate;
        document.getElementById('modal-venue').textContent  = p.venue || '';
        // 상태 뱃지
        const sEl = document.getElementById('modal-status');
        sEl.textContent = p.status || '';
        sEl.className   = 'modal-s ' + getStatusClass(p.status);
        // 런타임
        const rtRow = document.getElementById('modal-runtime-row');
        const rtEl  = document.getElementById('modal-runtime');
        if (p.runtime) { rtEl.textContent = p.runtime; rtRow.style.display = 'flex'; }
        else { rtRow.style.display = 'none'; }
        // 출연진
        const castRow = document.getElementById('modal-cast-row');
        const castEl  = document.getElementById('modal-cast');
        if (p.cast) { castEl.textContent = p.cast; castRow.style.display = 'flex'; }
        else { castRow.style.display = 'none'; }
        // KOPIS 링크
        const kbtn = document.getElementById('modal-kopis-btn');
        kbtn.href = p.kopisUrl || ('https://www.kopis.or.kr/por/db/pblprfr/pblprfrView.do?menuId=MNU_00010&pblprfrId=' + (p.id || ''));
        // 열기
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    window.closeModal = function() {
        document.getElementById('concert-modal').classList.remove('open');
        document.body.style.overflow = '';
    };

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });


    function renderPagination(total, page) {
    if (!paginEl) return;
    const pages = Math.ceil(total / PAGE_SIZE);
    if (pages <= 1) { paginEl.innerHTML = ''; return; }
    const btn = (i, active) =>
        `<button onclick="goPage(${i})" style="padding:.4rem .75rem;background:${active?'#e9c349':'none'};border:1px solid ${active?'#e9c349':'rgba(255,255,255,.12)'};color:${active?'#131313':'rgba(255,255,255,.45)'};border-radius:4px;cursor:pointer;font-size:12px;min-width:32px;">${i}</button>`;
    let html = `<button onclick="goPage(${page-1})" ${page<=1?'disabled':''} style="padding:.4rem .7rem;background:none;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.45);border-radius:4px;cursor:pointer;font-size:12px;">‹</button>`;
    for (let i = 1; i <= pages; i++) {
        if (i===1||i===pages||(i>=page-2&&i<=page+2)) html += btn(i, i===page);
        else if (i===page-3||i===page+3) html += `<span style="color:rgba(255,255,255,.25);padding:.4rem .2rem;">…</span>`;
    }
    html += `<button onclick="goPage(${page+1})" ${page>=pages?'disabled':''} style="padding:.4rem .7rem;background:none;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.45);border-radius:4px;cursor:pointer;font-size:12px;">›</button>`;
    paginEl.innerHTML = html;
}

window.goPage = function(p) {
    currentPage = p;
    renderGrid();
    window.scrollTo({ top: 0, behavior: 'smooth' });
};

function renderGrid() {
    const regionData = DB[activeRegion] || {};
    const allItems = regionData[activeVenue] || [];

    // 결과 헤더
    const label = getVenueLabel(activeVenue);
    resultCountEl.textContent = allItems.length + '개 공연';

    if (!allItems.length) {
        gridEl.innerHTML = '<div class="empty">해당 공연장의 공연 정보가 없습니다.</div>';
        if (paginEl) paginEl.innerHTML = '';
        return;
    }

    // 페이지네이션 슬라이싱
    const start = (currentPage - 1) * PAGE_SIZE;
    const items = allItems.slice(start, start + PAGE_SIZE);

    gridEl.innerHTML = items.map((p, i) => {
        const sc = getStatusClass(p.s);
        const sl = getStatusLabel(p.s);
        const venue = p.v || activeVenue;
        const venueLabel = getVenueLabel(venue);
        return `
        <article class="c-card fade-up" style="animation-delay:${Math.min(i,11)*0.03}s" data-idx="${i}">
            <div class="c-poster">
                <img src="${p.p}" alt="${p.t}" loading="lazy" onerror="this.style.display='none'">
                <span class="c-poster-ph">CLASSIC</span>
                <div class="c-poster-grad"></div>
            </div>
            <div class="c-info">
                <p class="c-venue-label">${venueLabel}</p>
                <p class="c-title">${p.t}</p>
                <p class="c-date">${p.d}<span class="c-status ${sc}">${sl}</span></p>
            </div>
        </article>`;
    }).join('');

    renderPagination(allItems.length, currentPage);
    // 카드 클릭 → 모달
    gridEl.querySelectorAll('.c-card').forEach((card, i) => {
        card.addEventListener('click', () => {
            const p = items[+card.dataset.idx];
            if (!p) return;
            openModal({
                id:        '',
                title:     p.t,
                startDate: p.d,
                endDate:   p.d,
                venue:     p.v || activeVenue,
                genre:     p.g || '',
                poster:    p.p || '',
                status:    p.s,
                runtime:   p.r || '',
                cast:      p.c || '',
            });
        });
    });
}

// 초기화
const paramR = new URLSearchParams(location.search).get('region');
const paramV = new URLSearchParams(location.search).get('venue');
if (paramR && REGIONS.includes(paramR)) activeRegion = paramR;

renderRegionTabs();
renderVenueChips();
if (paramV && DB[activeRegion]?.[paramV]) activeVenue = paramV;
renderGrid();
</script>
