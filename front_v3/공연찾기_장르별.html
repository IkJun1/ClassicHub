/* 장르 탭 */
#genre-tabs{scrollbar-width:none;}

.genre-tab{position:relative;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.38);background:none;border:none;cursor:pointer;padding:.6rem 0;transition:color .2s;white-space:nowrap;flex-shrink:0;}
.genre-tab::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:#e9c349;transform:scaleX(0);transition:transform .25s ease;}
.genre-tab:hover{color:rgba(255,255,255,.7);}
.genre-tab.on{color:#e9c349;}

/* 카드 그리드 — 1px 구분선 그리드 */
.card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}

/* 카드 */
.c-card{position:relative;overflow:hidden;cursor:pointer;background:#1c1b1b;border-radius:12px;transition:background .3s,transform .25s;}

.c-poster{position:relative;aspect-ratio:3/4;background:linear-gradient(145deg,#1c1c1c,#242424);display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px 12px 0 0;}
.c-poster-label{font-size:11px;color:rgba(255,255,255,.13);letter-spacing:.12em;user-select:none;}
.c-poster-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8) 0%,transparent 55%);opacity:0;transition:opacity .3s;}
.c-card:hover .c-poster-grad{opacity:1;}
.c-info{padding:.9rem 1rem 1.1rem;}
.c-label{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#e9c349;opacity:.75;margin-bottom:4px;}

.empty{grid-column:1/-1;padding:5rem 0;text-align:center;font-size:12px;color:rgba(255,255,255,.18);letter-spacing:.1em;}

.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-box{position:relative;width:min(820px,66vw);background:#111;border-radius:6px;overflow:hidden;display:grid;grid-template-columns:320px 1fr;transform:translateY(12px);transition:transform .25s ease;}

.modal-rule{width:100%;height:1px;background:linear-gradient(to right,rgba(233,195,73,.35),transparent);margin-bottom:20px;}

<script>
/* =====================================================================
   ClassicHub — 장르별 조회 (공연찾기_장르별.html)
   [백엔드 연동] fetchConcerts() 내 fetch 블록 주석 해제, DUMMY_DATA 제거
   API: GET /api/concerts?genre=교향곡&q=검색어&page=1&size=20
   응답: { total, page, size, items:[{id,title,startDate,venue,genre,poster,status}] }
===================================================================== */
document.addEventListener("DOMContentLoaded", function () {

    const GENRES = [
        { key: '교향곡',       label: '교향곡' },
        { key: '협주곡',       label: '협주곡' },
        { key: '오페라',       label: '오페라' },
        { key: '가곡',         label: '가곡' },
        { key: '피아노 소나타', label: '피아노 소나타' },
        { key: '변주곡',       label: '변주곡' },
        { key: '기타',         label: '기타' },
    ];

    const PAGE_SIZE   = 20;
    let activeGenre   = GENRES[0].key;
    let currentPage   = 1;
    const searchQuery = new URLSearchParams(location.search).get('q') || '';

    const tabsEl   = document.getElementById('genre-tabs');
    const gridEl   = document.getElementById('concert-grid');
    const paginEl  = document.getElementById('pagination');
    const labelEl  = document.getElementById('search-label');
    const countEl  = document.getElementById('result-count');

    // ── 더미 데이터 (백엔드 연동 전) ──────────────────────────
    const DUMMY = {
        '교향곡':        [
            {id:'d1',title:'베토벤 교향곡 9번 합창',   startDate:'2026.04.12',endDate:'2026.04.12',venue:'예술의전당',   status:'공연예정',poster:'',runtime:'2시간 30분',cast:'정명훈, 황수미, 김선, 사이먼 오닐, 크바스트호프 등',age:'만 7세 이상'},
            {id:'d2',title:'말러 교향곡 5번',           startDate:'2026.05.01',endDate:'2026.05.01',venue:'롯데콘서트홀', status:'공연예정',poster:'',runtime:'1시간 20분',cast:'야닉 네제세갱, 서울시향 등',age:'만 7세 이상'},
            {id:'d3',title:'브루크너 교향곡 8번',       startDate:'2026.06.10',endDate:'2026.06.10',venue:'세종문화회관', status:'공연예정',poster:'',runtime:'1시간 30분',cast:'크리스티안 틸레만, 드레스덴 슈타츠카펠레 등',age:'만 7세 이상'},
        ],
        '협주곡':        [
            {id:'d4',title:'멘델스존 바이올린 협주곡',        startDate:'2026.04.20',venue:'롯데콘서트홀',status:'공연예정',poster:''},
            {id:'d5',title:'라흐마니노프 피아노 협주곡 2번',  startDate:'2026.05.15',venue:'예술의전당',  status:'공연예정',poster:''},
            {id:'d6',title:'브람스 바이올린 협주곡',          startDate:'2026.06.20',venue:'KBS홀',       status:'공연완료',poster:''},
        ],
        '오페라':        [
            {id:'d7',title:'모차르트 마술피리', startDate:'2026.05.02',venue:'예술의전당 오페라극장',status:'공연예정',poster:''},
            {id:'d8',title:'푸치니 라보엠',     startDate:'2026.07.05',venue:'세종문화회관',        status:'공연예정',poster:''},
        ],
        '가곡':          [
            {id:'d9', title:'슈베르트 겨울 나그네',startDate:'2026.05.10',venue:'금호아트홀',status:'공연예정',poster:''},
            {id:'d10',title:'슈만 시인의 사랑',   startDate:'2026.06.08',venue:'IBK챔버홀', status:'공연예정',poster:''},
        ],
        '피아노 소나타': [
            {id:'d11',title:'베토벤 소나타 비창·월광',startDate:'2026.05.18',venue:'예술의전당 리사이틀홀',status:'공연예정',poster:''},
            {id:'d12',title:'쇼팽 녹턴 & 소나타',    startDate:'2026.06.25',venue:'롯데콘서트홀',       status:'공연예정',poster:''},
        ],
        '변주곡':        [
            {id:'d13',title:'베토벤 변주곡 세트',startDate:'2026.06.01',venue:'통영국제음악당',status:'공연예정',poster:''},
            {id:'d14',title:'골드베르크 변주곡',  startDate:'2026.07.12',venue:'IBK챔버홀',   status:'공연예정',poster:''},
        ],
        '기타':          [
            {id:'d15',title:'하이든 현악 합주',startDate:'2026.04.28',venue:'세종문화회관',status:'공연완료',poster:''},
        ],
    };

    // ── 데이터 요청 ────────────────────────────────────────────
    function fetchConcerts({ genre, q, page, size }) {
        /* [백엔드 연동 시] 아래 주석 해제, 위 DUMMY 객체 제거
        const params = new URLSearchParams({ genre, page, size });
        if (q) params.set('q', q);
        return fetch('/api/concerts?' + params).then(r => r.json());
        */
        const raw   = (DUMMY[genre] || []).filter(p => !q || p.title.includes(q));
        const start = (page - 1) * size;
        return Promise.resolve({
            total: raw.length,
            page, size,
            items: raw.slice(start, start + size).map(p => ({ ...p, genre })),
        });
    }

    // ── 공연 상태 ──────────────────────────────────────────────
    function statusClass(s) {
        if (s === '공연예정') return 'upcoming';
        if (s === '공연중')   return 'ongoing';
        return 'done';
    }
    function statusLabel(s) {
        if (s === '공연예정') return '예정';
        if (s === '공연중')   return '진행중';
        return '완료';
    }

    // ── 카드 HTML ─────────────────────────────────────────────
    let _cache = [];
    function cardHTML(p, idx) { _cache[idx] = p;
        const sc = statusClass(p.status);
        const sl = statusLabel(p.status);
        return `<article class="c-card" data-idx="${idx}">
            <div class="c-poster">
                ${p.poster ? `<img src="${p.poster}" alt="${p.title}" loading="lazy" onerror="this.style.display='none'">` : ''}
                <span class="c-poster-label">CLASSIC</span>
                <div class="c-poster-grad"></div>
            </div>
            <div class="c-info">
                <p class="c-label">${p.genre}</p>
                <p class="c-title">${p.title}</p>
                <p class="c-date">${p.startDate}
                    <span class="c-status ${sc}">${sl}</span>
                </p>
            </div>
        </article>`;
    }

    // ── 페이지네이션 ──────────────────────────────────────────
    function renderPagination(total, page, size) {
        const pages = Math.ceil(total / size);
        if (pages <= 1) { paginEl.innerHTML = ''; return; }
        const btnStyle = (active) =>
            `style="padding:.4rem .75rem;background:${active?'#e9c349':'none'};border:1px solid ${active?'#e9c349':'rgba(255,255,255,.12)'};color:${active?'#131313':'rgba(255,255,255,.45)'};border-radius:4px;cursor:pointer;font-size:12px;min-width:32px;"`;
        let html = `<button onclick="goPage(${page-1})" ${page<=1?'disabled':''} style="padding:.4rem .7rem;background:none;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.45);border-radius:4px;cursor:pointer;font-size:12px;">‹</button>`;
        for (let i = 1; i <= pages; i++) {
            if (i===1||i===pages||(i>=page-2&&i<=page+2)) {
                html += `<button onclick="goPage(${i})" ${btnStyle(i===page)}>${i}</button>`;
            } else if (i===page-3||i===page+3) {
                html += `<span style="color:rgba(255,255,255,.25);padding:.4rem .2rem;">…</span>`;
            }
        }
        html += `<button onclick="goPage(${page+1})" ${page>=pages?'disabled':''} style="padding:.4rem .7rem;background:none;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.45);border-radius:4px;cursor:pointer;font-size:12px;">›</button>`;
        paginEl.innerHTML = html;
    }

    window.goPage = function(p) {
        currentPage = p;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };


    // ── 모달 열기/닫기 ──────────────────────────────────────
    window.openModal = function openModal(p) {
        const overlay  = document.getElementById('concert-modal');
        // 포스터
        const img = document.getElementById('modal-poster-img');
        const ph  = document.getElementById('modal-poster-ph');
        if (p.poster) {
            img.src = p.poster; img.alt = p.title;
            img.style.display = 'block'; ph.style.display = 'none';
        } else {
            img.style.display = 'none'; ph.style.display = '';
        }
        // 텍스트 채우기
        document.getElementById('modal-genre').textContent  = p.genre || '';
        document.getElementById('modal-title').textContent  = p.title || '';
        document.getElementById('modal-date').textContent   =
            p.startDate === p.endDate ? p.startDate : p.startDate + ' ~ ' + p.endDate;
        document.getElementById('modal-venue').textContent  = p.venue || '';
        // 상태 뱃지
        const sEl = document.getElementById('modal-status');
        sEl.textContent = p.status || '';
        sEl.className   = 'modal-s ' + statusClass(p.status);
        // 런타임
        const rtRow = document.getElementById('modal-runtime-row');
        const rtEl  = document.getElementById('modal-runtime');
        if (p.runtime) { rtEl.textContent = p.runtime; rtRow.style.display = 'flex'; }
        else { rtRow.style.display = 'none'; }
        // 출연진
        const castRow = document.getElementById('modal-cast-row');
        const castEl  = document.getElementById('modal-cast');
        if (p.cast) { castEl.textContent = p.cast; castRow.style.display = 'flex'; }
        else { castRow.style.display = 'none'; }
        // KOPIS 링크
        const kbtn = document.getElementById('modal-kopis-btn');
        kbtn.href = p.kopisUrl || ('https://www.kopis.or.kr/por/db/pblprfr/pblprfrView.do?menuId=MNU_00010&pblprfrId=' + (p.id || ''));
        // 열기
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    window.closeModal = function() {
        document.getElementById('concert-modal').classList.remove('open');
        document.body.style.overflow = '';
    };

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // ── 렌더 ─────────────────────────────────────────────────
    function render() {
        const data = fetchConcerts({ genre: activeGenre, q: searchQuery, page: currentPage, size: PAGE_SIZE });
        data.then(d => {
            countEl.textContent = `총 ${d.total}개`;
            labelEl.textContent = searchQuery ? `"${searchQuery}" 검색 결과` : activeGenre;
            if (!d.items.length) {
                gridEl.innerHTML = '<div class="empty">해당 장르의 공연이 없습니다.</div>';
                paginEl.innerHTML = '';
                return;
            }
            _cache = [];
            gridEl.innerHTML = d.items.map((p,i) => cardHTML(p,i)).join('');
            gridEl.querySelectorAll('.c-card').forEach(card => {
                card.addEventListener('click', () => openModal(_cache[+card.dataset.idx]));
            });
            renderPagination(d.total, currentPage, PAGE_SIZE);
        });
    }

    // ── 탭 렌더 ──────────────────────────────────────────────
    function renderTabs() {
        tabsEl.innerHTML = '';
        GENRES.forEach(g => {
            const btn = document.createElement('button');
            btn.className = 'genre-tab' + (g.key === activeGenre ? ' on' : '');
            btn.textContent = g.label;
            btn.addEventListener('click', () => {
                activeGenre = g.key;
                currentPage = 1;
                renderTabs();
                render();
            });
            tabsEl.appendChild(btn);
        });
    }

    // ── 초기화 ───────────────────────────────────────────────
    const paramGenre = new URLSearchParams(location.search).get('genre');
    if (paramGenre && GENRES.find(g => g.key === paramGenre)) activeGenre = paramGenre;

    renderTabs();
    render();

});
</script>

<!-- ── 상세 모달 ── -->
