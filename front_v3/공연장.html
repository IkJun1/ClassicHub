<script>
document.addEventListener('DOMContentLoaded', async () => {
    const API = window.ClassicHubAPI;
    const gridEl = document.getElementById('venue-grid');
    const summaryEl = document.getElementById('venue-summary');

    const regionOrder = ['서울', '경기', '인천', '부산', '대구', '대전', '광주', '울산', '강원', '충북', '충남', '전북', '전남', '경북', '경남', '제주', '세종', '기타'];
    const sortRegions = (regions) => [...regions].sort((a, b) => {
        const ia = regionOrder.indexOf(a);
        const ib = regionOrder.indexOf(b);
        if (ia !== -1 || ib !== -1) return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
        return a.localeCompare(b, 'ko');
    });

    function renderVenueCard(name, region, idx) {
        const url = `공연찾기_장소별.html?region=${encodeURIComponent(region)}&venue=${encodeURIComponent(name)}`;
        return `
            <a class="venue-live-card rounded-2xl bg-surface-container-low ring-1 ring-white/5 border border-white/5 overflow-hidden block" href="${url}">
                <div class="h-44 bg-surface-container-lowest relative overflow-hidden flex items-center justify-center">
                    <div class="absolute inset-0 opacity-70" style="background:radial-gradient(circle at ${30 + (idx % 3) * 20}% 30%, rgba(233,195,73,.28), transparent 28%), linear-gradient(135deg, #111 0%, #252018 55%, #121212 100%);"></div>
                    <div class="relative z-10 text-primary/75 font-serif text-5xl">${API.escapeHTML((name || '?').slice(0, 1))}</div>
                </div>
                <div class="p-6">
                    <div class="text-primary text-[10px] tracking-[.28em] uppercase font-bold mb-2">${API.escapeHTML(region)}</div>
                    <h2 class="font-headline text-2xl text-on-surface mb-3 leading-tight">${API.escapeHTML(name)}</h2>
                    <p class="text-sm text-on-surface-variant font-light leading-relaxed mb-4">이 공연장에서 열리는 공연을 장소별 조회 화면에서 확인합니다.</p>
                    <span class="inline-flex items-center gap-2 text-xs text-primary/80">공연 보기 <span aria-hidden="true">→</span></span>
                </div>
            </a>`;
    }

    try {
        const res = await API.getVenuesByRegion();
        const venuesByRegion = res.data || {};
        const regions = sortRegions(Object.keys(venuesByRegion).filter(r => Array.isArray(venuesByRegion[r]) && venuesByRegion[r].length));
        const cards = [];
        regions.forEach(region => {
            venuesByRegion[region].forEach(venue => cards.push({ region, venue }));
        });

        summaryEl.textContent = `${regions.length}개 지역 · ${cards.length}개 공연장`;
        if (!cards.length) {
            gridEl.innerHTML = '<div class="text-white/35 text-sm">등록된 공연장 데이터가 없습니다.</div>';
            return;
        }
        gridEl.innerHTML = cards.map((item, idx) => renderVenueCard(item.venue, item.region, idx)).join('');
    } catch (e) {
        console.error('공연장 목록 조회 실패:', e);
        summaryEl.textContent = '조회 실패';
        gridEl.innerHTML = '<div class="text-white/35 text-sm">백엔드 공연장 데이터를 불러오지 못했습니다. 서버가 실행 중인지 확인하세요.</div>';
    }
});
</script>
